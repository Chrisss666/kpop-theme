; ════════════════════════════════════════════════════════════
; kpop-theme — color scheme definitions
;
; Defines the Spicetify color tokens used by user.css (referenced
; there as --spice-* CSS variables). Two schemes are provided:
;   [Base]  - dark  (default)
;   [light] - light
; Switch between them via `spicetify config color_scheme <name>`
;
; Author:  Chrisss666
; License: MIT (see LICENSE)
; Repo:    https://github.com/Chrisss666/kpop-theme
; ════════════════════════════════════════════════════════════

